name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Lint and build
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Check the tag against manifest.json and versions.json
        run: |
          version=$(jq -r .version manifest.json)
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi
          if ! jq -e --arg v "$version" 'has($v)' versions.json > /dev/null; then
            echo "::error::versions.json has no entry for $version"
            exit 1
          fi

      - name: Attest manifest.json and theme.css
        uses: actions/attest@v4
        with:
          subject-path: |
            manifest.json
            dist/theme.css

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout leaves a lightweight tag; fetch the annotated one for its message
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-from-tag --verify-tag manifest.json dist/theme.css
